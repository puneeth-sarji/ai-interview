<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Coding Interview Platform</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="navbar">
            <div class="logo">
                <span class="gradient-text">AI Interview</span> <span class="badge">Live</span>
            </div>
            <div class="controls">
                <select id="language-select">
                    <option value="python">Python</option>
                    <option value="javascript">JavaScript</option>
                </select>
                <div class="room-info">Room ID: <strong id="room-display">connecting...</strong></div>
            </div>
        </header>
        
        <main class="main-content">
            <div class="editor-section panel glass">
                <div class="panel-header">
                    <h2>Code Editor</h2>
                    <div class="actions">
                        <button id="run-btn" class="btn primary-btn">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                            Run Code
                        </button>
                        <button id="analyze-btn" class="btn magic-btn">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg>
                            AI Analysis
                        </button>
                    </div>
                </div>
                <textarea id="code-editor" spellcheck="false" placeholder="# Write your code here..."></textarea>
            </div>
            
            <div class="sidebar">
                <div class="output-section panel glass">
                    <div class="panel-header">
                        <h2>Execution Output</h2>
                    </div>
                    <div id="output-terminal" class="terminal-content">Waiting for execution...</div>
                </div>
                
                <div class="ai-section panel glass">
                    <div class="panel-header">
                        <h2>AI Feedback <span class="sparkle">✨</span></h2>
                    </div>
                    <div id="ai-feedback" class="markdown-content">Click "AI Analysis" to get feedback from Gemini.</div>
                </div>
            </div>
        </main>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
